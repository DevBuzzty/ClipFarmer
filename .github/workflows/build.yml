name: Build and Release Windows App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python Backend
        run: |
          pip install pyinstaller
          # Use --name app to ensure the executable is named app.exe
          pyinstaller --noconfirm --onefile --name app --distpath frontend/backend_dist --collect-all faster_whisper --collect-all moviepy --collect-all flask --collect-all flask_cors --collect-all google.genai --collect-all requests --hidden-import flask --hidden-import flask_cors --hidden-import requests backend/app.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Build Electron App
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
          tag_name: latest
          name: Latest Release
          body: "Automatisch erstellter Build vom main Branch."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
