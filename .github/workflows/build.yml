name: Build and Release ViraFlow (Flet)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller flet

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm flet_build.spec

      - name: Package Release
        run: |
          Compress-Archive -Path dist/ViraFlow -DestinationPath ViraFlow_Windows.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ViraFlow_Windows.zip
          tag_name: v2.0.${{ github.run_number }}
          name: ViraFlow v2.0 (Flet Edition)
          body: "Unified Python AI Twitch Automator - Deep Dark Space Edition. Build via Flet."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
